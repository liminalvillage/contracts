specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Holons.sol
    network: localhost
    source:
      address: "0x2bdCC0de6bE1f7D2ee689a0342D76F52E8EFABa3"
      abi: Holons.sol
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        # - NewFlavor
        - NewHolon
      abis:
        - name: Holons.sol
          file: ./abis/Holons.json
      eventHandlers:
        # - event: NewFlavor(indexed address,string)
        #   handler: handleNewFlavor
        - event: NewHolon(string,address)
          handler: handleNewHolon
      file: ./src/holons.ts

  # ManagedFactory
  - kind: ethereum/contract
    name: ManagedFactory
    network: localhost
    source:
      address: "0x5f3f1dBD7B74C6B46e8c44f98792A1dAf8d69154"
      abi: ManagedFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Managed
        - ManagedFactory
      abis:
        - name: ManagedFactory
          file: ./abis/ManagedFactory.json
      eventHandlers:
        - event: ManagedContractCreated(indexed address,indexed string,string)
          handler: handleManagedContractCreated
      file: ./src/managedFactory.ts

  # ZonedFactory
  - kind: ethereum/contract
    name: ZonedFactory
    network: localhost
    source:
      address: "0xb7278A61aa25c888815aFC32Ad3cC52fF24fE575"
      abi: ZonedFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Zoned
        - ZonedFactory
      abis:
        - name: ZonedFactory
          file: ./abis/ZonedFactory.json
      eventHandlers:
        - event: ZonedContractCreated(indexed address,indexed string,string,uint256)
          handler: handleZonedContractCreated
      file: ./src/zonedFactory.ts

templates:
  - name: Splitter
    kind: ethereum/contract
    network: localhost
    source:
      abi: Splitter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/splitter.ts
      entities:
        - FundsForwarded
        - Splitter
      abis:
        - name: Splitter
          file: ./abis/Splitter.json
      eventHandlers:
        - event: FundsForwarded(indexed address,indexed address,uint256)
          handler: handleFundsForwarded
        - event: ChildHolonCreated(indexed address,indexed string,string)
          handler: handleChildHolonCreated
        - event: RewardDistributed(indexed address,uint256,uint256,string)
          handler: handleRewardDistributed
        - event: MemberRewarded(indexed address,indexed address,uint256,bool,string)
          handler: handleMemberRewarded

  - name: Zoned
    kind: ethereum/contract
    network: localhost
    source:
      abi: Zoned
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/splitter.ts
      entities:
        - HolonContract
        - RewardDistribution
        - MemberReward       
      abis:
        - name: Zoned
          file: ./abis/Zoned.json
      eventHandlers:
        - event: RewardDistributed(indexed address,uint256,uint256,string)
          handler: handleRewardDistributed
        - event: MemberRewarded(indexed address,indexed address,uint256,bool,string)
          handler: handleMemberRewarded

  - name: Managed
    kind: ethereum/contract
    network: localhost
    source:
      abi: Managed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/splitter.ts
      entities:
        - HolonContract
        - RewardDistribution
        - MemberReward       
      abis:
        - name: Managed
          file: ./abis/Managed.json
      eventHandlers:
        - event: RewardDistributed(indexed address,uint256,uint256,string)
          handler: handleRewardDistributed
        - event: MemberRewarded(indexed address,indexed address,uint256,bool,string)
          handler: handleMemberRewarded