type Holon @entity {
  id: ID!
  name: String!
  address: Bytes!
  creatorUserId: String!
  holonType: HolonType!
  parameter: BigInt # Only for Zoned holons
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Relationships
  splitter: Splitter
  managed: Managed
  zoned: Zoned
}

enum HolonType {
  SPLITTER
  MANAGED
  ZONED
}

type Splitter @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  parameter: BigInt!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Child holons
  managedHolon: Managed
  zonedHolon: Zoned
}

type Managed @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  creator: Bytes! # msg.sender from factory
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Parent relationship
  parentSplitter: Splitter
}

type Zoned @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  creator: Bytes! # msg.sender from factory
  parameter: BigInt!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Parent relationship
  parentSplitter: Splitter
}

# Factory tracking entities
type HolonsContract @entity {
  id: ID! # Contract address
  totalHolons: BigInt!
  totalSplitters: BigInt!
  createdAt: BigInt!
}

type ManagedFactory @entity {
  id: ID! # Contract address
  totalManaged: BigInt!
  createdAt: BigInt!
}

type ZonedFactory @entity {
  id: ID! # Contract address
  totalZoned: BigInt!
  createdAt: BigInt!
}

type FundsForwarded @entity {
  id: ID!
  splitterAddress: Bytes!
  fromAddress: Bytes!
  toAddress: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}