type Holon @entity {
  id: ID!
  name: String!
  address: Bytes!
  creatorUserId: String!
  holonType: HolonType!
  parameter: BigInt # Only for Zoned holons
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Relationships
  splitter: Splitter
  managed: Managed
  zoned: Zoned
}

enum HolonType {
  SPLITTER
  MANAGED
  ZONED
}

type Splitter @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  parameter: BigInt!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Child holons
  managedHolon: Managed
  zonedHolon: Zoned
}

type Managed @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  creator: Bytes! # msg.sender from factory
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Parent relationship
  parentSplitter: Splitter
}

type Zoned @entity {
  id: ID! # Contract address
  name: String!
  address: Bytes!
  creatorUserId: String!
  creator: Bytes! # msg.sender from factory
  parameter: BigInt!
  createdAt: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
  
  # Parent relationship
  parentSplitter: Splitter
}

# Factory tracking entities
type HolonsContract @entity {
  id: ID! # Contract address
  totalHolons: BigInt!
  totalSplitters: BigInt!
  createdAt: BigInt!
}

type ManagedFactory @entity {
  id: ID! # Contract address
  totalManaged: BigInt!
  createdAt: BigInt!
}

type ZonedFactory @entity {
  id: ID! # Contract address
  totalZoned: BigInt!
  createdAt: BigInt!
}

type FundsForwarded @entity {
  id: ID!
  splitterAddress: Bytes!
  toAddress: Bytes!        # Child contract address (Managed or Zoned)
  tokenAddress: Bytes!     # Token address (0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE for ETH)
  amount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type MemberRewarded @entity {
  id: ID!
  contractAddress: Bytes!  # Managed or Zoned contract address
  recipient: Bytes!
  amount: BigInt!
  isContract: Boolean!
  rewardType: String!      # "ETH", "ERC20", "STORED_ETH", "STORED_ERC20"
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

type RewardDistributed @entity {
  id: ID!
  contractAddress: Bytes!  # Managed or Zoned contract address
  totalAmount: BigInt!
  totalMembers: BigInt!
  rewardType: String!      # "ETH" or "ERC20"
  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}