specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Holons.sol
    network: localhost
    source:
      address: "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      abi: Holons.sol
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        # - NewFlavor
        - NewHolon
      abis:
        - name: Holons.sol
          file: ./abis/Holons.json
      eventHandlers:
        # - event: NewFlavor(indexed address,string)
        #   handler: handleNewFlavor
        - event: NewHolon(string,address)
          handler: handleNewHolon
      file: ./src/holons.ts

  # ManagedFactory
  - kind: ethereum/contract
    name: ManagedFactory
    network: localhost
    source:
      address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      abi: ManagedFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Managed
        - ManagedFactory
      abis:
        - name: ManagedFactory
          file: ./abis/ManagedFactory.json
      eventHandlers:
        - event: ManagedContractCreated(indexed address,indexed string,string)
          handler: handleManagedContractCreated
      file: ./src/managedFactory.ts

  # ZonedFactory
  - kind: ethereum/contract
    name: ZonedFactory
    network: localhost
    source:
      address: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      abi: ZonedFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Zoned
        - ZonedFactory
      abis:
        - name: ZonedFactory
          file: ./abis/ZonedFactory.json
      eventHandlers:
        - event: ZonedContractCreated(indexed address,indexed string,string,uint256)
          handler: handleZonedContractCreated
      file: ./src/zonedFactory.ts

templates:
  - name: Splitter
    kind: ethereum/contract
    network: localhost
    source:
      abi: Splitter
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/splitter.ts
      entities:
        - FundsForwarded
        - Splitter
      abis:
        - name: Splitter
          file: ./abis/Splitter.json
      eventHandlers:
        - event: FundsForwarded(indexed address,indexed address,uint256)
          handler: handleFundsForwarded
        - event: ChildHolonCreated(indexed address,indexed string,string)
          handler: handleChildHolonCreated


  - name: Zoned
    kind: ethereum/contract
    network: localhost
    source:
      abi: Zoned
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/zoned.ts
      entities:
        - MemberRewarded
        - RewardDistributed
        - Splitter
      abis:
        - name: Zoned
          file: ./abis/Zoned.json
      eventHandlers:
        - event: RewardDistributed(indexed address,uint256,uint256,string)
          handler: handleRewardDistributed
        - event: MemberRewarded(indexed address,indexed address,uint256,bool,string)
          handler: handleMemberRewarded

  - name: Managed
    kind: ethereum/contract
    network: localhost
    source:
      abi: Managed
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/managed.ts
      entities:
        - MemberRewarded
        - RewardDistributed
        - Splitter
      abis:
        - name: Managed
          file: ./abis/Managed.json
      eventHandlers:
        - event: RewardDistributed(indexed address,uint256,uint256,string)
          handler: handleRewardDistributed
        - event: MemberRewarded(indexed address,indexed address,uint256,bool,string)
          handler: handleMemberRewarded