[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/"
]
optimizer = true
optimizer_runs = 200
#Please comment this out in production, we used it for scripts that are counting the state
#via_ir = true
#Please comment this out in production, we used it for scripts that are counting the state

fs_permissions = [
  { access = "read-write", path = "./out" }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options